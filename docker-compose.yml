#
# Deploy compose.
#
# Docker provides the runtime environment; the tt-rss source tree is bind-mounted
# from this checkout. Update deployed application code with `git pull` on the
# host, then restart the app services if PHP processes need to pick up changes.
#

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - ${TTRSS_ENV_FILE:-.env}
    environment:
      - POSTGRES_USER=${TTRSS_DB_USER:-postgres}
      - POSTGRES_PASSWORD=${TTRSS_DB_PASS:-password}
      - POSTGRES_DB=${TTRSS_DB_NAME:-postgres}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  app:
    image: ghcr.io/tt-rss/tt-rss:latest
    restart: unless-stopped
    environment:
      SKIP_RSYNC_ON_STARTUP: true
      TTRSS_DB_USER: ${TTRSS_DB_USER:-postgres}
      TTRSS_DB_NAME: ${TTRSS_DB_NAME:-postgres}
      TTRSS_DB_PASS: ${TTRSS_DB_PASS:-password}
    env_file:
      - ${TTRSS_ENV_FILE:-.env}
    volumes:
      - .:/var/www/html/tt-rss
      - ./data/cache:/var/www/html/tt-rss/cache
      - ./data/lock:/var/www/html/tt-rss/lock
      - ./data/plugins.local:/var/www/html/tt-rss/plugins.local
      - ./data/templates.local:/var/www/html/tt-rss/templates.local
      - ./data/themes.local:/var/www/html/tt-rss/themes.local
      - ./data/config.php:/var/www/html/tt-rss/config.php
    depends_on:
      - db

  updater:
    image: ghcr.io/tt-rss/tt-rss:latest
    restart: unless-stopped
    environment:
      SKIP_RSYNC_ON_STARTUP: true
      TTRSS_DB_USER: ${TTRSS_DB_USER:-postgres}
      TTRSS_DB_NAME: ${TTRSS_DB_NAME:-postgres}
      TTRSS_DB_PASS: ${TTRSS_DB_PASS:-password}
    env_file:
      - ${TTRSS_ENV_FILE:-.env}
    volumes:
      - .:/var/www/html/tt-rss
      - ./data/cache:/var/www/html/tt-rss/cache
      - ./data/lock:/var/www/html/tt-rss/lock
      - ./data/plugins.local:/var/www/html/tt-rss/plugins.local
      - ./data/templates.local:/var/www/html/tt-rss/templates.local
      - ./data/themes.local:/var/www/html/tt-rss/themes.local
      - ./data/config.php:/var/www/html/tt-rss/config.php
    depends_on:
      - app
    command: /opt/tt-rss/updater.sh

  web-nginx:
    image: ghcr.io/tt-rss/tt-rss-web-nginx:latest
    restart: unless-stopped
    env_file:
      - ${TTRSS_ENV_FILE:-.env}
    ports:
      - ${HTTP_PORT:-127.0.0.1:8280}:80
    volumes:
      - .:/var/www/html/tt-rss:ro
      - ./data/cache:/var/www/html/tt-rss/cache:ro
      - ./data/plugins.local:/var/www/html/tt-rss/plugins.local:ro
      - ./data/templates.local:/var/www/html/tt-rss/templates.local:ro
      - ./data/themes.local:/var/www/html/tt-rss/themes.local:ro
      - ./data/config.php:/var/www/html/tt-rss/config.php:ro
    depends_on:
      - app
